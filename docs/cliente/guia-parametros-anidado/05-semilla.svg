<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2420" role="img" aria-labelledby="t d">
  <title id="t">La semilla: las mismas piezas por dos caminos</title>
  <desc id="d">Dos franjas con las mismas seis piezas. Con una semilla las piezas quedan acomodadas de una manera; con otra semilla quedan de otra manera y la franja termina más corta, lo que puede ahorrar una chapa.</desc>
  <rect width="720" height="280" rx="8" fill="#F5F1E8"/>

  <text x="30" y="36" font-weight="600">Semilla 42</text>
  <rect x="30" y="46" width="660" height="80" fill="#FFFDF8" stroke="#2B2420" stroke-width="1.5"/>
  <g fill="#2E8074">
    <rect x="36" y="51" width="60" height="70"/>
    <polygon points="102,121 102,51 172,121"/>
    <rect x="178" y="51" width="100" height="32"/>
    <rect x="178" y="89" width="80" height="32"/>
    <rect x="284" y="51" width="40" height="70"/>
    <polygon points="330,121 330,51 400,121"/>
  </g>
  <path d="M404 38v96" stroke="#C9922E" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="414" y="91" font-size="12.5">la franja llega hasta acá</text>

  <text x="30" y="166" font-weight="600">Semilla 7</text>
  <rect x="30" y="176" width="660" height="80" fill="#FFFDF8" stroke="#2B2420" stroke-width="1.5"/>
  <g fill="#2E8074">
    <rect x="36" y="181" width="60" height="70"/>
    <rect x="102" y="181" width="40" height="70"/>
    <polygon points="148,251 148,181 218,251"/>
    <polygon points="156,181 226,181 226,251"/>
    <rect x="232" y="181" width="100" height="32"/>
    <rect x="232" y="219" width="80" height="32"/>
  </g>
  <path d="M336 168v96" stroke="#C9922E" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="346" y="221" font-size="12.5">esta quedó más corta: puede ahorrar una chapa</text>
</svg>
