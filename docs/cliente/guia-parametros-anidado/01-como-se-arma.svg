<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2420" role="img" aria-labelledby="t d">
  <title id="t">Cómo se arma el anidado</title>
  <desc id="d">En la primera búsqueda Sparrow acomoda todas las piezas en una franja. Las que quedaron enteras dentro del ancho de una chapa van a la chapa 1. Las demás se vuelven a acomodar en la búsqueda siguiente, y así hasta que no quedan piezas.</desc>
  <rect width="720" height="320" rx="8" fill="#F5F1E8"/>

  <text x="30" y="34" font-weight="600">Búsqueda 1: todas las piezas</text>
  <rect x="30" y="50" width="280" height="160" fill="#FFFDF8" stroke="#2B2420" stroke-width="1.5"/>
  <rect x="30" y="50" width="80" height="160" fill="#2E8074" fill-opacity="0.10" stroke="#2E8074" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g fill="#2E8074">
    <rect x="36" y="58" width="26" height="64"/>
    <rect x="68" y="58" width="20" height="40"/>
    <rect x="68" y="104" width="20" height="30"/>
    <circle cx="60" cy="166" r="22"/>
  </g>
  <g fill="#B9B1A3">
    <rect x="94" y="58" width="36" height="90"/>
    <rect x="90" y="156" width="44" height="44"/>
    <circle cx="160" cy="90" r="26"/>
    <rect x="140" y="130" width="50" height="24"/>
    <rect x="144" y="164" width="60" height="36"/>
    <polygon points="196,58 236,58 236,150 212,150 212,84 196,84"/>
    <rect x="244" y="58" width="30" height="60"/>
    <circle cx="252" cy="172" r="22"/>
  </g>
  <path d="M30 218v8h80v-8" fill="none" stroke="#2E8074" stroke-width="1.5"/>
  <text x="30" y="244" font-size="12.5">va a la chapa 1</text>

  <path d="M325 130h58" stroke="#2B2420" stroke-width="2"/>
  <path d="M383 123l14 7-14 7z"/>

  <text x="410" y="34" font-weight="600">Búsqueda 2: las que quedaron</text>
  <rect x="410" y="50" width="200" height="160" fill="#FFFDF8" stroke="#2B2420" stroke-width="1.5"/>
  <rect x="410" y="50" width="80" height="160" fill="#2E8074" fill-opacity="0.10" stroke="#2E8074" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g fill="#2E8074">
    <rect x="416" y="58" width="36" height="90"/>
    <rect x="456" y="58" width="30" height="60"/>
    <rect x="416" y="156" width="50" height="24"/>
  </g>
  <g fill="#B9B1A3">
    <rect x="496" y="58" width="44" height="44"/>
    <circle cx="524" cy="136" r="26"/>
    <polygon points="548,58 588,58 588,150 564,150 564,84 548,84"/>
    <rect x="496" y="170" width="60" height="36"/>
    <circle cx="584" cy="182" r="22"/>
  </g>
  <path d="M410 218v8h80v-8" fill="none" stroke="#2E8074" stroke-width="1.5"/>
  <text x="410" y="244" font-size="12.5">va a la chapa 2</text>
  <text x="632" y="140" font-size="30">…</text>

  <rect x="30" y="266" width="14" height="14" fill="#2E8074"/>
  <text x="52" y="278" font-size="12.5">Quedó entera dentro del ancho de una chapa: va a esa chapa.</text>
  <rect x="30" y="290" width="14" height="14" fill="#B9B1A3"/>
  <text x="52" y="302" font-size="12.5">Quedó afuera o pisa el borde: se vuelve a acomodar en la búsqueda siguiente.</text>
</svg>
