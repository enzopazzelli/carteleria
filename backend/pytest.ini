[pytest]
pythonpath = .
# Solo las pruebas del repo: `local/` (fuera de git) guarda copias y
# herramientas de cada trabajo, y un `test_*.py` suelto ahí entraba en la
# suite.
testpaths = tests
markers =
    sin_sesion_de_prueba: la prueba entra de verdad: el arnés no le pone el usuario de prueba (1.1)
