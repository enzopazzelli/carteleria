name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Botón "Run workflow" en la pestaña Actions, para dispararlo a mano sin
  # tener que inventar un commit.
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # El dominio del nesting ya tiene 225 tests escritos y hasta hoy no los corría
  # nadie automáticamente: había que acordarse de `pytest` a mano. Es la
  # primer paso del plan de testing de _metodo/reglas.md §5 ("CI con lint y
  # typecheck en cada push"), aplicado con los tests ya hechos.
  #
  # Corre sobre SQLite local, como el modo de desarrollo de
  # docs/PLAN-SLICE-VERTICAL.md: no hace falta PostgreSQL ni Docker en el
  # runner, así que el CI no depende de infraestructura que todavía no existe
  # (CART-001 sigue sin empezar).
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # Python 3.11: la versión del ADR-05, la misma contra la que se eligieron
      # shapely, rectpack y ezdxf.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Las migraciones tienen que poder correr de cero contra una base vacía.
      # Es el error que en GeoMuni dejó la base rota al crearla desde cero
      # (06-retrospectiva/02-evitar.md, punto 2): el schema real se había
      # armado a parches y el script de setup no lo reproducía.
      - run: alembic upgrade head

      - run: pytest -q

# -----------------------------------------------------------------------------
# Lo que a propósito NO está acá todavía:
#
# - `nesting-engine/`: su `npm test` es un test de humo que necesita vendorizar
#   deepnest-next primero (scripts/vendorizar.mjs baja el paquete). Mientras
#   D-01 siga abierto y el motor irregular no esté conectado a la API, meterlo
#   al CI es sumar una descarga frágil por un código que puede no quedar.
#
# - Un linter. `requirements-dev.txt` no tiene ninguno configurado, y agregar
#   ruff acá sin haberlo corrido antes en local pone el CI en rojo el primer
#   día por cientos de avisos de estilo. Se suma cuando se decida la config,
#   no antes.
# -----------------------------------------------------------------------------
